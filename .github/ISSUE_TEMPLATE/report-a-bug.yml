---
name: Report a bug.
description: Give notice of wrong behavior to let the development team of OpenMarkov to fix it.
labels: ["Priority - Minor", "Status - Pending review"]
type: bug
body:

  - type: textarea
    id: what-happened
    attributes:
      label: Description
      description: Tell us what happened and what you were expecting to happen.
      placeholder: |
          Ex: When opening the properties for a node "A" and giving it a new name "Disease",
          the name remains at the original name ("A"), while it was expected to change to the new name. 
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What Operating System are you using?
      multiple: false
      options:
        - Windows
        - Linux
        - macOS
      default: 0
    validations:
      required: true

  - type: dropdown
    id: distribution
    attributes:
      label: Distribution
      description: What OpenMarkov distribution are you using?
      multiple: false
      options:
        - .jar file
        - Portable program (.exe)
        - Insalled program (.msi, .exe, .rpm...)
      default: 0
    validations:
      required: true


  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false
      
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: What version of our software are you running?
      options:
        - 1.0.2 (Default)
        - 1.0.3 (Edge)
      default: 0
    validations:
      required: true
      
  - type: dropdown
    id: browsers
    attributes:
      label: What browsers are you seeing the problem on?
      multiple: true
      options:
        - Firefox
        - Chrome
        - Safari
        - Microsoft Edge
        
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
      
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://example.com).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
          
  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false

---
